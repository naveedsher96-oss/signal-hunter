# Runs "Find warm companies" + re-scans your saved list every Monday.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   APP_URL     e.g. https://signal-hunter-xxxx.onrender.com
#   CRON_TOKEN  copy it from Render > your service > Environment
name: Weekly scan

on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC = 08:00 in Pakistan
  workflow_dispatch: {}    # lets you run it by hand from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wake the app and start the scan
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          set -u
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/out -w '%{http_code}' --max-time 90 \
              -X POST -H "X-Cron-Token: $CRON_TOKEN" "$APP_URL/api/cron" || true)
            echo "attempt $i -> HTTP $code: $(cat /tmp/out 2>/dev/null)"
            if [ "$code" = "202" ] || [ "$code" = "409" ]; then break; fi
            sleep 30
          done
          if [ "$code" != "202" ] && [ "$code" != "409" ]; then exit 1; fi

      - name: Keep the app awake until the scan finishes
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          for i in $(seq 1 55); do
            s=$(curl -s --max-time 60 -H "X-Cron-Token: $CRON_TOKEN" "$APP_URL/api/cron/status" || true)
            echo "$(date -u +%H:%M) $s"
            echo "$s" | grep -q '"state":"running"' || { echo "Finished."; exit 0; }
            sleep 60
          done
