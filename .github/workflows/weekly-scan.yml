# Runs "Find warm companies" + re-scans your saved list every Monday, for free,
# right here on GitHub. Results go to your Supabase database and appear under
# History in the app on your computer.
# Needs one repository secret (Settings > Secrets and variables > Actions):
#   DATABASE_URL   your Supabase "Session pooler" connection string
name: Weekly scan

on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC = 08:00 in Pakistan
  workflow_dispatch: {}    # lets you run it by hand from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run the weekly scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Add the DATABASE_URL secret first (see README)."; exit 1
          fi
          python cron_scan.py
