# Render Blueprint: https://render.com/docs/blueprint-spec
# One free web service. The database lives in Supabase (free) - see README.
services:
  - type: web
    name: signal-hunter
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 1 worker on purpose: scan progress is kept in memory. Threads handle requests.
    startCommand: gunicorn webapp:app --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_PASSWORD
        sync: false        # Render asks you for it during setup
      - key: DATABASE_URL
        sync: false        # Supabase "Session pooler" connection string
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_TOKEN
        generateValue: true
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
